name: Release

on:
  workflow_dispatch: # manual build from the Actions tab: archives as run artifacts, no release
  push:
    tags: ['v*'] # e.g. v0.1.0 -> builds and publishes a GitHub Release

permissions:
  contents: write # needed to create the release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # musl gives a static binary that runs on any Linux of the same architecture.
      - name: Install musl and cmake
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The licenses of the crates in the binary (about.toml, about.hbs), then the
      # built-in font's license and MoonProto's NOTICE, which Apache-2.0 asks to keep.
      - name: Third-party licenses
        run: |
          mkdir -p out/pnl-bot
          out=out/pnl-bot/THIRD_PARTY_LICENSES
          cargo about generate --locked --fail -o "$out" about.hbs
          moonproto="$(dirname "$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "moonproto") | .manifest_path')")"
          test -f "$moonproto/NOTICE"
          {
            printf '\n%s\nJetBrains Mono font (assets/fonts), SIL Open Font License 1.1\n\n' "$(printf '%.0s-' {1..80})"
            cat assets/fonts/OFL.txt
            printf '\n%s\nMoonProto NOTICE\n\n' "$(printf '%.0s-' {1..80})"
            cat "$moonproto/NOTICE"
          } >> "$out"

      # The layout install.sh expects: the binary next to it and no Cargo.toml.
      - name: Package
        run: |
          mkdir -p out/pnl-bot/deploy
          cp "target/$TARGET/release/pnl-bot" install.sh .env.example README.md LICENSE out/pnl-bot/
          cp deploy/pnl-bot.service deploy/pnl-bot-passphrase.sh deploy/pnl.sh out/pnl-bot/deploy/
          chmod 755 out/pnl-bot/pnl-bot out/pnl-bot/install.sh
          file out/pnl-bot/pnl-bot
          tar -C out -czf "pnl-bot-linux-${{ matrix.arch }}.tar.gz" pnl-bot

      - uses: actions/upload-artifact@v7
        with:
          name: pnl-bot-linux-${{ matrix.arch }}
          path: pnl-bot-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum pnl-bot-linux-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" pnl-bot-linux-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
