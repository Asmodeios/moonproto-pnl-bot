[package]
name = "pnl-bot"
version = "0.1.1"
description = "Telegram bot reporting PnL from MoonBot cores over MoonProto"
authors = ["Asmodeios"]
edition = "2021"
publish = false

[dependencies]
# MoonBot's client SDK for its MoonProto UDP protocol. Not on crates.io and
# untagged, so pinned to a commit.
moonproto = { git = "https://github.com/Moonbot-Tech/MoonProto", rev = "793e9233cee9960f7e56c30f88556df23beb0823" }
# `bundled` compiles SQLite in — no system library needed on the server.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4.34"
env_logger = "0.11"
dotenvy = "0.15"
getrandom = "0.2"
resvg = "0.45"
# The passphrase lock: Argon2id derives the key that seals the core keys.
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
zeroize = "1"

[profile.release]
strip = true
lto = true
